[project]
name = "micora"
version = "0.1.0"
description = "Micora local voice cloning TTS inference engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.25.0",
    "mlx>=0.32.2",
    "mlx-audio>=0.5.4",
    "numpy>=1.26.0",
    "onnxruntime>=1.20.0",
    "sentencepiece>=0.2.0",
    "soundfile>=0.12.1",
    "soxr>=0.5.0",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

